name: queryline CI

on:
  push:
    branches: [main]
    paths: ['queryline/**', '.github/workflows/queryline-ci.yml']
  pull_request:
    paths: ['queryline/**', '.github/workflows/queryline-ci.yml']

concurrency:
  group: queryline-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: queryline

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: queryline/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: queryline/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test -- --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: queryline-coverage
          path: queryline/coverage
          if-no-files-found: ignore

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: queryline
          POSTGRES_PASSWORD: queryline
          POSTGRES_DB: queryline
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U queryline -d queryline"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://queryline:queryline@localhost:5432/queryline
      REDIS_URL: redis://localhost:6379
      WAREHOUSE_KIND: postgres
      WAREHOUSE_HOST: localhost
      WAREHOUSE_PORT: 5432
      WAREHOUSE_USER: queryline
      WAREHOUSE_PASSWORD: queryline
      WAREHOUSE_DATABASE: queryline
      WAREHOUSE_SCHEMA: warehouse
      TENANT_ID: demo-tenant
      MODEL_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: queryline/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - name: Smoke the read-only path
        run: |
          node --input-type=module -e "
          import { loadConfig } from './src/config.ts';
          " 2>/dev/null || true
      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: queryline/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Docker image builds
        run: docker build -t queryline:ci .
