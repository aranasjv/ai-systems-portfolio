services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: queryline
      POSTGRES_PASSWORD: queryline
      POSTGRES_DB: queryline
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U queryline -d queryline']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  jaeger:
    image: jaegertracing/all-in-one:1.62
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports:
      - '16686:16686'
      - '4317:4317'
      - '4318:4318'

  # Optional warehouses. Start with: docker compose --profile mssql up -d
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles: ['mssql']
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: 'Queryline!Passw0rd'
      MSSQL_PID: 'Developer'
    ports:
      - '1433:1433'

  # Large image (~1GB). Start with: docker compose --profile oracle up -d
  oracle:
    image: gvenzl/oracle-free:23-slim
    profiles: ['oracle']
    environment:
      ORACLE_PASSWORD: 'Queryline!Passw0rd'
      APP_USER: 'queryline'
      APP_USER_PASSWORD: 'Queryline!Passw0rd'
    ports:
      - '1521:1521'
